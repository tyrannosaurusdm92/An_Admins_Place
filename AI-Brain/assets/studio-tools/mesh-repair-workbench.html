<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mesh Repair Workbench</title><link rel="stylesheet" href="../studio-styles/unified-studio-tools.css"></head><body><main class="tool"><h1>Mesh Repair Workbench</h1><div class="grid"><label>Vertices<input id="v" type="number"></label><label>Faces<input id="f" type="number"></label><label>Non-manifold edges<input id="nm" type="number"></label><label>Degenerate faces<input id="dg" type="number"></label></div><p><button id="check">Create repair plan</button></p><div id="out" class="out"></div></main><script>check.onclick=()=>{const s=[];if(+nm.value)s.push("Inspect boundaries and non-manifold edges before filling holes or welding geometry.");if(+dg.value)s.push("Remove or retriangulate degenerate faces.");s.push("Recalculate/inspect normals.","Preserve UVs, vertex colors and material assignments.","Measure before/after counts and visually validate.");out.textContent=s.join("\n")}</script></body></html>
