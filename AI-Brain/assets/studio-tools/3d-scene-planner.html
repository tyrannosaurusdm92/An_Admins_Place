<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3D Scene Planner</title><link rel="stylesheet" href="../studio-styles/unified-studio-tools.css"></head><body><main class="tool"><h1>3D Scene Planner</h1><div class="grid"><label>Purpose<select id="purpose"><option>Web/GLB</option><option>3D print</option><option>Game asset</option><option>Illustration/render</option></select></label><label>Scale/units<input id="units" value="meters"></label><label>Geometry<select id="geo"><option>Mesh</option><option>Parametric CSG</option><option>Procedural nodes</option><option>Scan/point cloud</option></select></label><label>Format<select id="format"><option>GLB</option><option>STL</option><option>OBJ</option><option>PLY</option><option>FBX</option></select></label></div><p><button id="build">Build plan</button></p><div id="out" class="out"></div></main><script>build.onclick=()=>out.textContent=[`Purpose: ${purpose.value}`,`Units: ${units.value}`,`Geometry: ${geo.value}`,`Output: ${format.value}`,"1. Establish scale/origin and hierarchy.","2. Create/edit geometry non-destructively.","3. Validate topology and attributes.","4. Validate materials/UVs if required.","5. Export and re-import a test artifact."].join("\n")</script></body></html>
