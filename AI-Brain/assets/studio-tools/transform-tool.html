<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Transform | AI-Brain Studio Tool</title><style>body{font-family:system-ui,Arial,sans-serif;margin:0;background:#111;color:#eee}main{max-width:980px;margin:auto;padding:20px}.panel{border:1px solid #555;background:#1c1c1c;padding:14px;border-radius:12px}.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.control{padding:10px;background:#252525;border:1px solid #444;border-radius:8px}label{display:block;font-weight:700;margin-bottom:5px}input,select,button{width:100%;box-sizing:border-box;padding:8px}canvas{width:100%;height:280px;background:repeating-linear-gradient(45deg,#222 0 10px,#2d2d2d 10px 20px);border:1px solid #666;margin-top:14px}pre{white-space:pre-wrap;background:#0c0c0c;padding:10px;border-radius:8px}</style></head><body><main><h1>Transform</h1><p>Reusable, project-agnostic studio control surface. No embedded image, SVG, audio, video, or GIF assets.</p><section class="panel"><div class="controls"><div class="control"><label>Nudge</label><input data-key="nudge" type="range" min="0" max="100" value="50"></div><div class="control"><label>Rotate</label><input data-key="rotate" type="range" min="0" max="100" value="50"></div><div class="control"><label>Skew</label><input data-key="skew" type="range" min="0" max="100" value="50"></div><div class="control"><label>Perspective</label><input data-key="perspective" type="range" min="0" max="100" value="50"></div><div class="control"><label>Flip</label><input data-key="flip" type="range" min="0" max="100" value="50"></div><div class="control"><label>Align</label><input data-key="align" type="range" min="0" max="100" value="50"></div><div class="control"><label>Distribute</label><input data-key="distribute" type="range" min="0" max="100" value="50"></div></div><canvas id="preview" width="960" height="280" aria-label="preview canvas"></canvas><pre id="state"></pre></section></main><script>const controls=[...document.querySelectorAll('[data-key]')],state=document.getElementById('state'),ctx=document.getElementById('preview').getContext('2d');function render(){const s=Object.fromEntries(controls.map(x=>[x.dataset.key,Number(x.value)]));state.textContent=JSON.stringify(s,null,2);ctx.clearRect(0,0,960,280);ctx.fillStyle='rgba(255,255,255,.16)';ctx.fillRect(80,60,800,160);ctx.strokeStyle='white';ctx.lineWidth=1+(s[Object.keys(s)[0]]||50)/20;ctx.strokeRect(80,60,800,160)}controls.forEach(x=>x.addEventListener('input',render));render();</script></body></html>
