<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Parametric CSG Builder</title><link rel="stylesheet" href="../studio-styles/unified-studio-tools.css"></head><body><main class="tool"><h1>Parametric CSG Builder</h1><div class="grid"><label>Primitive<select id="p"><option>cube</option><option>sphere</option><option>cylinder</option></select></label><label>Size<input id="size" value="10"></label><label>Operation<select id="op"><option>union</option><option>difference</option><option>intersection</option></select></label></div><p><button id="make">Generate starter SCAD</button></p><div id="out" class="out"></div></main><script>make.onclick=()=>{let shape=p.value==="cube"?`cube([${size.value},${size.value},${size.value}], center=true);`:p.value==="sphere"?`sphere(r=${size.value});`:`cylinder(h=${size.value}, r=${size.value}/2, center=true);`;out.textContent=`${op.value}(){\n  ${shape}\n}`}</script></body></html>
