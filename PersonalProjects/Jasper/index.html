<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#21150d">
  <meta name="description" content="Jasper's private interactive branching fanfiction book.">
  <title>Jasper's Fanfiction Spot</title>
  <link rel="stylesheet" href="css/book.css">
</head>
<body>
  <main class="app-shell is-home" id="appShell">
    <div class="book-stage">
      <div class="book-outer" id="bookOuter">
        <article class="closed-cover" id="closedCover" aria-label="Book cover">
          <button class="cover-open-hitbox" id="openBookBtn" type="button" data-action="open-book" aria-label="Open Jasper's Fanfiction Spot">
            <img class="cover-art-image" src="assets/book-cover.png" alt="Jasper's Fanfiction Spot book cover">
            <span class="open-hint">Open book</span>
          </button>
        </article>

        <div class="book-zoom-frame" id="bookZoomFrame">
          <article class="book" id="book" aria-live="polite" aria-label="Interactive fanfiction book">
            <div class="page-stack page-stack-left" aria-hidden="true"></div>
            <div class="page-stack page-stack-right" aria-hidden="true"></div>
            <div class="binding-shadow" aria-hidden="true"></div>
            <section class="page left-page" id="leftPage" data-side="left" aria-label="Left book page">
              <div id="leftContent"></div>
              <span class="page-number" id="leftPageNumber" aria-hidden="true"></span>
              <span class="page-grab-hint page-grab-hint-left" aria-hidden="true">‹</span>
            </section>
            <section class="page right-page" id="rightPage" data-side="right" aria-label="Right book page">
              <div id="rightContent"></div>
              <span class="page-number" id="rightPageNumber" aria-hidden="true"></span>
              <span class="page-grab-hint page-grab-hint-right" aria-hidden="true">›</span>
            </section>
            <div class="turn-sheet" id="turnSheet" aria-hidden="true">
              <div class="sheet-face sheet-front"></div>
              <div class="sheet-face sheet-back"></div>
              <div class="fold-ridge ridge-a"></div>
              <div class="fold-ridge ridge-b"></div>
              <div class="curl-edge"></div>
            </div>
          </article>
        </div>
        <div class="reader-status-sr" id="pageFooter" aria-live="polite"><span id="footerStatus"></span></div>
      </div>
    </div>

    <div class="reader-drawer-scrim" id="readerDrawerScrim" aria-hidden="true"></div>
    <aside class="reader-drawer" id="readerDrawer" aria-label="Reader menu" aria-hidden="true">
      <div class="reader-drawer-head">
        <div>
          <strong>Jasper's Fanfiction Spot</strong>
          <span id="drawerStoryStatus">Library</span>
        </div>
        <button type="button" id="readerDrawerClose" aria-label="Close reader menu">×</button>
      </div>

      <div class="drawer-section drawer-library-section">
        <div class="drawer-section-head"><strong>Library</strong><button type="button" data-action="create-story">+ Create</button></div>
        <div class="hud-library" id="hudLibrary" aria-label="Fanfiction library"></div>
      </div>

      <div class="drawer-section" id="readerToolbar" hidden>
        <div class="drawer-section-head"><strong>Chapter tools</strong></div>
        <label class="search-wrap">Search chapters
          <input id="searchInput" type="search" placeholder="Title or phrase" autocomplete="off">
        </label>
        <div class="drawer-tool-grid">
          <button type="button" data-action="home">Library</button>
          <button type="button" data-action="save-progress">Save</button>
          <button type="button" data-action="undo">Undo</button>
          <button type="button" data-action="save-branch">Bookmark</button>
          <button type="button" data-action="story-settings">Settings</button>
          <button type="button" data-action="cover">Close Book</button>
        </div>
      </div>

      <aside class="side-panel" id="sidePanel" aria-label="Chapter contents" hidden>
        <div class="drawer-section-head"><strong id="sideTitle">Chapters</strong><span class="index-count" id="sideCount"></span></div>
        <div class="index-group">
          <div id="chapterIndex"></div>
        </div>
        <div class="index-group branch-journal" id="branchJournal" hidden>
          <h3>My path</h3>
          <div id="journalEntries"></div>
        </div>
      </aside>

      <div class="drawer-section">
        <div class="drawer-section-head"><strong>Book</strong></div>
        <div class="drawer-book-controls">
          <button type="button" data-action="smaller" aria-label="Make book smaller">A−</button>
          <span id="zoomLabel">100%</span>
          <button type="button" data-action="larger" aria-label="Make book larger">A+</button>
          <button type="button" data-action="sound" id="soundButton">Sound: on</button>
        </div>
        <div class="drawer-tool-grid drawer-file-tools">
          <button type="button" data-action="import-json">Import JSON</button>
          <button type="button" data-action="import-folder">Import Folder</button>
          <button type="button" data-action="connect-folder">Connect Folder</button>
          <button type="button" data-action="export-generated">Export New</button>
        </div>
      </div>
    </aside>

    <nav class="reader-hud" id="readerHud" aria-label="Book HUD">
      <button class="hud-menu-button" id="readerMenuButton" type="button" aria-expanded="false" aria-controls="readerDrawer" aria-label="Open reader menu">☰</button>
      <div class="hud-fanfic-picker">
        <details class="hud-fanfic-dropdown" id="hudFanficDropdown">
          <summary id="hudFanficSummary" aria-label="Choose a fanfic">
            <span id="hudFanficLabel">Fanfic</span><span class="hud-fanfic-chevron" aria-hidden="true">▾</span>
          </summary>
          <div class="hud-fanfic-menu" id="hudFanficMenu" aria-label="Choose a fanfiction"></div>
        </details>
        <span id="hudPageStatus" aria-live="polite">Open the book</span>
        <strong id="hudStoryTitle" class="sr-only">Jasper's Fanfiction Spot</strong>
      </div>
      <div class="hud-quick-actions" aria-label="Fanfiction actions">
        <button class="hud-create" type="button" data-action="create-story" aria-label="Create fanfic" title="Create fanfic">＋</button>
        <button type="button" data-action="save-progress" aria-label="Save progress" title="Save progress">▣</button>
        <button type="button" data-action="undo" aria-label="Undo last choice" title="Undo last choice">↶</button>
      </div>
      <div class="hud-page-actions" aria-label="Fallback page controls">
        <button type="button" data-action="previous" aria-label="Previous page" title="Previous page">‹</button>
        <button type="button" data-action="next" aria-label="Next page" title="Next page">›</button>
      </div>
    </nav>
  </main>

  <audio id="pageFlipAudio" src="assets/page-flip.wav" preload="auto"></audio>
  <script src="js/fanfic-data.js"></script>
  <script src="js/cyoa-story-engine.js"></script>
  <script src="js/app.js?v=20260919-github-menu-pagefix-1"></script>
  <!-- Optional project-specific helpers load after the stable book runtime. -->
  <script src="js/jasper-fanfiction-reader-profile.js"></script>
  <script src="js/jasper-fanfiction-writing-style.js"></script>
  <script src="js/jasper-fanfiction-canon-era.js"></script>
  <script src="js/jasper-fanfiction-character-reactions.js"></script>
  <script src="js/jasper-fanfiction-relationship-engine.js"></script>
  <script src="js/jasper-fanfiction-continuity-memory.js"></script>
  <script src="js/jasper-fanfiction-session-memory.js"></script>
  <script src="js/jasper-fanfiction-story-graph.js"></script>
  <script src="js/jasper-fanfiction-branch-builder.js"></script>
  <script src="js/jasper-fanfiction-setting-generator.js"></script>
  <script src="js/jasper-fanfiction-fandom-context.js"></script>
  <script src="js/jasper-fanfiction-lore-library.js"></script>
  <script src="js/jasper-fanfiction-dialogue-parser.js"></script>
  <script src="js/jasper-fanfiction-character-context.js"></script>
  <script src="js/jasper-fanfiction-character-prompt.js"></script>
  <script src="js/jasper-fanfiction-character-dialogue.js"></script>
  <script src="js/jasper-fanfiction-generation-stream.js"></script>
  <script src="js/jasper-fanfiction-intent-fallback.js"></script>
  <script src="js/jasper-fanfiction-runtime.js"></script>
</body>
</html>
